{% extends "base.html" %}
{% block title %}Editar perfil | Blog Web{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 560px;">
  <h1 class="h3 mb-4">Editar perfil</h1>
  <form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">
    {% csrf_token %}
    {% include "form_fields.html" with form=usuario_form %}
    {% include "form_fields.html" with form=perfil_form %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{% url 'perfil' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
