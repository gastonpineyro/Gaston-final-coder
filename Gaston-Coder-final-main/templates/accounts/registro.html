{% extends "base.html" %}
{% block title %}Registrarse | Blog Web{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 480px;">
  <h1 class="h3 mb-4">Crear cuenta</h1>
  <form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {% include "form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100">Registrarme</button>
  </form>
  <p class="mt-3 text-center">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
</div>
{% endblock %}
