{% extends "base.html" %}
{% block title %}Eliminar post | Blog Web{% endblock %}
{% block content %}
<div class="mx-auto card card-body shadow-sm" style="max-width: 560px;">
  <h1 class="h4">¿Eliminar "{{ object.titulo }}"?</h1>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
